default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        files: ^(scripts|mac-worker)/.*\.sh$

  # Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ['--fix', '--exit-non-zero-on-fix']
        files: ^(tests|scripts|mac-worker|ansible/roles/[^/]+/files)/.*\.py$

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.9.0
    hooks:
      - id: ansible-lint
        files: ^ansible/

  - repo: local
    hooks:
      - id: ansible-syntax-check
        name: ansible-syntax-check
        entry: scripts/with-dev-env.sh bash -c 'cd ansible && for f in playbooks/*.yml; do ansible-playbook --syntax-check "$f" || exit 1; done'
        language: system
        files: ^ansible/
        pass_filenames: false

      - id: vault-placeholder-check
        name: vault-placeholder-check
        entry: scripts/check-vault-placeholders.sh
        language: script
        files: ^ansible/inventory/.*vault\.yml$
        pass_filenames: false

      # Duplicate host-port detection across all compose templates. Part of
      # `make validate`; gated here so two services can't claim the same host
      # port and slip onto master. Only fires when a compose template changes.
      - id: lint-ports
        name: lint-ports (duplicate host ports)
        entry: scripts/with-dev-env.sh python3 tests/lint_ports.py
        language: system
        files: ^ansible/roles/.*/templates/docker-compose\.yml\.j2$
        pass_filenames: false

      # Full Python test suite (222 tests, ~2.5s) — the diff-logic modules,
      # control API, backup, vmalert rules, etc. The repo mandates a test for
      # every cron diff-logic module, but those tests only mattered if they
      # actually ran; pre-commit never invoked pytest, so a test-breaking change
      # could land on master ungated (the repo deploys direct-to-master with CI
      # on manual-trigger only — private repo, minutes exhausted). Runs on
      # pre-push (once per push, not per commit) to keep commit latency low.
      # Activate the stage with: pre-commit install --hook-type pre-push
      - id: go-runtime
        name: Go runtime race tests and vet
        entry: make go-test
        language: system
        files: ^runtime/
        pass_filenames: false

      - id: pytest
        name: pytest (full suite)
        entry: scripts/with-dev-env.sh python3 -m pytest tests/ -q
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.yml']

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
