---
- name: Converge — render Watchtower templates to tmp dir for assertion
  hosts: localhost
  gather_facts: false
  vars:
    docker_user: pi
    timezone: Europe/Istanbul
    # group_vars/all/main.yml normally provides these; stub them here so the
    # molecule play works in isolation.
    ntfy_port: 2586
    ntfy_topic: homelab
    ntfy_hostname: ntfy.example
    ntfy_external_base_url: "http://ntfy.example:2586"
    ntfy_external_topic_url: "http://ntfy.example:2586/homelab"
    ntfy_shoutrrr_url: "ntfy://ntfy.example:2586/homelab?scheme=http"
    ansible_facts:
      default_ipv4:
        address: "127.0.0.1"
  pre_tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"

    - name: Override compose dir to a tmp sandbox
      ansible.builtin.set_fact:
        watchtower_compose_dir: /tmp/molecule-watchtower

    - name: Ensure sandbox dir exists
      ansible.builtin.file:
        path: "{{ watchtower_compose_dir }}"
        state: directory
        mode: "0755"
  tasks:
    - name: Render docker-compose.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/docker-compose.yml.j2"
        dest: "{{ watchtower_compose_dir }}/docker-compose.yml"
        mode: "0644"
