---
- name: Allow Homepage through UFW
  community.general.ufw:
    rule: allow
    port: "3001"
    proto: tcp
    from_ip: "{{ lan_subnet }}"
    comment: Homepage dashboard

# One-time reconciliation of the pre-2026-07-14 Anywhere rule (see media role
# ufw.yml). Idempotent no-op once removed.
- name: Remove superseded Anywhere rule (migrated to LAN scope, Phase 0)
  community.general.ufw:
    rule: allow
    port: "3001"
    proto: tcp
    delete: true
