---
- name: Create vmagent compose directory
  ansible.builtin.file:
    path: "{{ vmagent_compose_dir }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create vmagent data directory (root-owned — container runs as root)
  # cap_drop: [ALL] removes CAP_DAC_OVERRIDE; ownership must match container UID (0).
  ansible.builtin.file:
    path: "{{ vmagent_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Create vmagent config directory
  ansible.builtin.file:
    path: "{{ vmagent_config_dir }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Render vmagent scrape config
  ansible.builtin.template:
    src: scrape.yml.j2
    dest: "{{ vmagent_config_dir }}/scrape.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart vmagent

- name: Copy vmagent docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vmagent_compose_dir }}/docker-compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart vmagent

- name: Start vmagent container
  community.docker.docker_compose_v2:
    project_src: "{{ vmagent_compose_dir }}"
    state: present
  become: true
  become_user: "{{ docker_user }}"
