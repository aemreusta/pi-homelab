---
- name: Verify — assert hardening directives are present in rendered files
  hosts: localhost
  gather_facts: false
  vars:
    sandbox: /tmp/molecule-vmagent
  tasks:
    - name: Slurp docker-compose.yml
      ansible.builtin.slurp:
        src: "{{ sandbox }}/docker-compose.yml"
      register: dc

    - name: Decode docker-compose
      ansible.builtin.set_fact:
        compose_yaml: "{{ (dc.content | b64decode) | from_yaml }}"

    - name: Assert hardening directives + host network preserved
      ansible.builtin.assert:
        that:
          - "'no-new-privileges:true' in compose_yaml.services.vmagent.security_opt"
          - "'ALL' in compose_yaml.services.vmagent.cap_drop"
          - compose_yaml.services.vmagent.read_only | bool
          - compose_yaml.services.vmagent.tmpfs[0] is search('/tmp:.*noexec.*nosuid.*nodev.*size=')
          - compose_yaml.services.vmagent.pids_limit | int > 0
          - compose_yaml.services.vmagent.mem_limit is defined
          - compose_yaml.services.vmagent.healthcheck is defined
          - compose_yaml.services.vmagent.network_mode == 'host'
          - compose_yaml.services.vmagent.labels['org.opencontainers.image.title'] is defined
          - compose_yaml.services.vmagent.labels['org.opencontainers.image.source'] is defined
          - compose_yaml.services.vmagent.labels['org.opencontainers.image.vendor'] is defined
        fail_msg: "vmagent hardening incomplete or network_mode regressed"
