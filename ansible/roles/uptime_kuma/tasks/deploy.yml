---
- name: Create Uptime Kuma compose directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_compose_dir }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create Uptime Kuma data directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_data_dir }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Copy Uptime Kuma docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uptime_kuma_compose_dir }}/docker-compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart uptime_kuma

- name: Start Uptime Kuma container
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_compose_dir }}"
    state: present
  become: true
  become_user: "{{ docker_user }}"
