---
- name: Deploy Go log observer
  ansible.builtin.include_role:
    name: homelab_runtime

- name: Include rclone install tasks
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [gdrive_backup, install]
  tags: [gdrive_backup, install]

- name: Include gdrive sync configuration tasks
  ansible.builtin.include_tasks:
    file: configure.yml
    apply:
      tags: [gdrive_backup, configure]
  tags: [gdrive_backup, configure]
