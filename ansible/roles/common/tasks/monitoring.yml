    modification_time: preserve
    access_time: preserve

- name: Deploy logrotate config for memory monitor log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/memory-monitor
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/memory-monitor.log {
          weekly
          rotate 4
          compress
          missingok
          notifempty
          create 0640 root root
      }

- name: Deploy memory monitoring script
  ansible.builtin.template:
    src: memory-alert.sh.j2
    dest: /usr/local/bin/memory-alert.sh
    owner: root
    group: root
