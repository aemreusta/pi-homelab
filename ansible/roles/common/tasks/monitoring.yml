    src: pid-budget-alert.sh.j2
    dest: /usr/local/bin/pid-budget-alert.sh
    owner: root
    group: root
    mode: "0755"

- name: Schedule pid-budget-alert every 15 minutes
  ansible.builtin.cron:
    name: "pid-budget-alert"
    user: root
    minute: "10,25,40,55"
    job: "/usr/local/bin/pid-budget-alert.sh"
    state: "{{ 'absent' if common_use_vmalert | default(false) else 'present' }}"

- name: Deploy logrotate config for pid-budget-alert log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/pid-budget-alert
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/pid-budget-alert.log {
          weekly
          rotate 4
          compress
          missingok
          notifempty
          create 0640 root root
      }

