---
# Shared alert audit library — provides ntfy_send() with structured logging
# so every notification is recorded in /var/log/alert-audit.log.
- name: Create alert lib directory
  ansible.builtin.file:
    path: /usr/local/lib/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create alert audit log file
  ansible.builtin.file:
    path: /var/log/alert-audit.log
    state: touch
    owner: root
    group: root
    # DEFERS to alertmanager/tasks/deploy.yml, which is the AUTHORITATIVE
    # owner of this file's mode (it runs the producing ntfy-bridge container).
    # This task exists only so host-side crons that run as {{ docker_user }}
    # (daily-report.sh, junk-scan.sh via alert-lib.sh) have a writable log
    # during base provisioning, BEFORE alertmanager is ever deployed. The
    # mode MUST stay identical to alertmanager's (0666) — common runs AFTER
    # alertmanager on a full provision and historically clobbered 0666→0640,
    # silently breaking every non-root writer (incident 2026-05-29,
    # docs/incidents/). If you change the mode, change it in alertmanager
    # first, then mirror it here and in the logrotate `create` below. Rationale
    # for 0666 vs shared-group 0664: docs/operations/ops-discipline.md.
    mode: "0666"
    modification_time: preserve
    access_time: preserve
  # Idempotent-report hygiene: with times preserved + mode already correct,
  # `touch` is a no-op on re-provision; pin changed_when so a re-run never
  # shows spurious "changed" against the authoritative alertmanager task.
  changed_when: false

- name: Deploy shared alert library
  ansible.builtin.template:
    src: alert-lib.sh.j2
    dest: /usr/local/lib/homelab/alert-lib.sh
    owner: root
    group: root
    mode: "0644"

- name: Deploy logrotate config for alert audit log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/alert-audit
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/alert-audit.log {
          weekly
          rotate 4
          compress
          missingok
          notifempty
          # 0666: post-rotation file must stay writable by the ntfy-bridge
          # container (nobody/65534) and {{ docker_user }} crons, else the
          # first write after each weekly rotation fails. This is the
          # post-rotation authority — it must mirror alertmanager's mode
          # (the touch-task owner). Matches the touch task above and
          # alertmanager/tasks/deploy.yml. See docs/operations/ops-discipline.md.
          create 0666 root root
      }

# Retention cleanup — reclaim DISPOSABLE artifacts older than
# common_retention_days (default 30): Docker images/build-cache/stopped-
# containers/networks past the window + Tdarr transcode-cache scratch. This
# SUPERSEDES the old unbounded `docker system prune -af --volumes` weekly job,
# which removed ALL unused images immediately and could drop named volumes
# holding data. The new job is age-gated and volume-safe and NEVER touches
# /srv library/downloads or backups. See docs/runbooks/038-2026-05-29-retention-cleanup.md + the
# no-data-removal hard rule. Emits a node_exporter textfile metric.
- name: Create retention-cleanup log file
  ansible.builtin.file:
    path: "{{ common_retention_log | default('/var/log/retention-cleanup.log') }}"
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Deploy retention-cleanup script
  ansible.builtin.template:
    src: retention-cleanup.sh.j2
    dest: /usr/local/bin/retention-cleanup.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy logrotate config for retention-cleanup log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/retention-cleanup
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ common_retention_log | default('/var/log/retention-cleanup.log') }} {
          weekly
          rotate 8
          compress
          missingok
          notifempty
          create 0640 root root
      }

- name: Schedule weekly retention cleanup (Sun 04:00)
  ansible.builtin.cron:
    name: "retention cleanup"
    user: root
    weekday: "0"
    hour: "4"
    minute: "0"
    job: "/usr/local/bin/retention-cleanup.sh"

# Supersede the old unbounded docker-prune job cleanly (remove cron + script +
# its logrotate stanza). The old /var/log/docker-prune.log is left in place so
# its history survives; logrotate will age it out under its existing rule until
# the file naturally rotates away.
- name: Remove superseded docker system prune cron
  ansible.builtin.cron:
    name: "docker system prune"
    user: "{{ item }}"
    state: absent
  loop:
    - root
    - "{{ docker_user }}"

- name: Remove superseded docker-prune script + logrotate config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/docker-prune.sh
    - /etc/logrotate.d/docker-prune

# Disk usage alert — runs every 6 hours, sends ntfy alert if threshold exceeded.
# Owned by docker_user, matching another role's task for the same path: its
# emitter/reconciler crons write state here as that user, while the root-run
# alert scripts can write regardless. With owner root, every `make base`
# flipped the directory to root and broke those writes until the next
# deploy of that role flipped it back.
- name: Ensure homelab state directory for alert cooldowns
  ansible.builtin.file:
    path: "{{ common_disk_alert_state_dir | default('/var/lib/homelab') }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Deploy disk usage alert script
  ansible.builtin.template:
    src: disk-alert.sh.j2
    dest: /usr/local/bin/disk-alert.sh
    owner: root
    group: root
    mode: "0755"

- name: Schedule disk usage alert every 6 hours
  ansible.builtin.cron:
    name: "disk usage alert"
    user: root
    hour: "*/6"
    minute: "15"
    job: "/usr/local/bin/disk-alert.sh"
    state: "{{ 'absent' if common_use_vmalert | default(false) else 'present' }}"

# Memory monitoring — alerts on high swap, logs container memory usage
- name: Create memory monitor log file
  ansible.builtin.file:
