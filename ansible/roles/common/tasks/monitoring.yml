    job: "/usr/local/bin/memory-alert.sh"
    state: "{{ 'absent' if common_use_vmalert | default(false) else 'present' }}"

# Unhealthy-watchdog — Sprint 016 Item A. Closes the gap where a container
# is reporting health=unhealthy but its parent service (docker, systemd) is
# perfectly happy to leave it that way. Same state-file + ntfy pattern as
# disk-alert + memory-alert; budget cap of 5 restarts / 24 h prevents
# restart-loop noise if a container is genuinely broken.
- name: Create unhealthy-watchdog log file
  ansible.builtin.file:
    path: /var/log/unhealthy-watchdog.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Validate watchdog engine
  ansible.builtin.assert:
    that:
      - common_watchdog_engine in ['go', 'legacy']

- name: Probe installed watchdog command before selecting Go
  ansible.builtin.command:
    argv:
      - "{{ homelab_runtime_binary | default('/usr/local/bin/homelab-agent') }}"
      - unhealthy-watchdog
      - --probe
  changed_when: false
  check_mode: false
  when: common_watchdog_engine == 'go'

- name: Create private watchdog ledger directory
  ansible.builtin.file:
    path: "{{ common_watchdog_ledger | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy retained legacy watchdog
  ansible.builtin.template:
    src: unhealthy-watchdog-legacy.sh.j2
    dest: /usr/local/bin/unhealthy-watchdog-legacy.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy watchdog notification helper
  ansible.builtin.template:
    src: watchdog-notify.sh.j2
    dest: /usr/local/bin/watchdog-notify.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy unhealthy-watchdog script
  ansible.builtin.template:
    src: unhealthy-watchdog.sh.j2
    dest: /usr/local/bin/unhealthy-watchdog.sh
    owner: root
    group: root
    mode: "0755"

- name: Schedule unhealthy-watchdog every 5 minutes
  # NOTE: unhealthy-watchdog is NOT gated on common_use_vmalert — it both
  # alerts AND restarts. vmalert has no equivalent action-side automation;
  # this stays as cron under all configurations. Sprint 18 decom plan.
  ansible.builtin.cron:
    name: "unhealthy-watchdog"
    user: root
    minute: "*/5"
    job: "/usr/local/bin/unhealthy-watchdog.sh"

- name: Deploy logrotate config for unhealthy-watchdog log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/unhealthy-watchdog
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/unhealthy-watchdog.log {
          weekly
          rotate 4
          compress
          missingok
          notifempty
          create 0640 root root
      }

# PID-budget alert — Sprint 016 Item B. cgroup-v2 pids.current vs pids.max
# per container; warn ≥70%, crit ≥90%; 24 h cooldown with hysteresis +
# clear-event. Sister script to memory-alert.sh.
- name: Create pid-budget-alert log file
  ansible.builtin.file:
    path: /var/log/pid-budget-alert.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Deploy pid-budget-alert script
