# Dead-man's switch — heartbeat every 24h. If the operator stops seeing
# these, ntfy is down, cron is broken, or the Pi is unreachable.
- name: Deploy heartbeat script
  ansible.builtin.template:
    src: heartbeat.sh.j2
    dest: /usr/local/bin/heartbeat.sh
    owner: root
    group: root
    mode: "0755"

- name: Schedule daily heartbeat (dead-man's switch)
  ansible.builtin.cron:
    name: "homelab heartbeat"
    user: root
    hour: "9"
    minute: "0"
    job: "/usr/local/bin/heartbeat.sh"

# Restore-drill nudge — Sprint 017 Story 6. Quarterly ntfy reminder to run
# the next backup-restore drill (cron fires on 1st Monday of Jan/Apr/Jul/Oct
# at 10:00). The script's date guard handles the "1st Monday" constraint
# that cron can't express directly.
- name: Deploy restore-drill nudge script
  ansible.builtin.template:
    src: restore-drill-nudge.sh.j2
    dest: /usr/local/bin/restore-drill-nudge.sh
    owner: root
    group: root
    mode: "0755"

- name: Schedule quarterly restore-drill nudge (1st Monday Jan/Apr/Jul/Oct 10:00)
  ansible.builtin.cron:
    name: "restore-drill nudge"
    user: root
    minute: "0"
    hour: "10"
    day: "1-7"
    month: "1,4,7,10"
    weekday: "1"
    job: "/usr/local/bin/restore-drill-nudge.sh"

# External dead-man's-switch — composite-liveness beat to healthchecks.io every
# 5 min. The only alert path that survives the Pi itself dying. No-ops until
# vault_healthchecks_ping_url is set. See templates/deadman-heartbeat.sh.j2.
- name: Deploy dead-man's-switch heartbeat script
  ansible.builtin.template:
    src: deadman-heartbeat.sh.j2
    dest: /usr/local/bin/deadman-heartbeat.sh
    owner: root
    group: root
    mode: "0755"

- name: Schedule dead-man's-switch heartbeat (every 5 min)
  ansible.builtin.cron:
    name: "deadman heartbeat"
    user: root
    minute: "*/5"
    job: "/usr/local/bin/deadman-heartbeat.sh"

# SMART disk health check — daily. Alerts on SMART failure or reallocated
# sector growth. Requires smartmontools package (common/packages.yml).
- name: Include SMART collector tasks
  ansible.builtin.include_tasks: smart.yml

# The Debian smartmontools package ships an auto-enabled smartd daemon
# that scans devices at boot and exits with status 17 ("No devices to
# monitor") because the USB-SATA bridge on this Pi doesn't expose SMART
# through smartd's default probe. The custom smart-check.sh above uses
# the `-d scsi` override from inventory and replaces smartd entirely.
# Masked (not just disabled) so package upgrades can't silently
# re-enable via `systemctl preset`.
- name: Mask redundant smartmontools.service (replaced by smart-check.sh cron)
  ansible.builtin.systemd:
    # Canonical unit name on Debian is `smartmontools.service`; `smartd.service`
    # is an Alias=. Masking the alias fails because /etc/systemd/system/smartd.service
    # already symlinks into /usr/lib/systemd/system/smartmontools.service — mask
    # the real unit instead.
    name: smartmontools.service
    masked: true
    enabled: false
    state: stopped
  become: true
  notify: Reset failed state for smartmontools.service
