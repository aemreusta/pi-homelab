---
# Pin homelab service hostnames → Pi LAN IP in /etc/hosts.
#
# Why this exists (PM review CR1, docs/archive/design/025-ntfy-dns-name.md):
# Every host-side alert script (memory-alert.sh, disk-alert.sh,
# docker-prune.sh, daily-report.sh, junk-scan.sh) now resolves
# *.example hostnames instead of raw IPs. On the Pi, /etc/resolv.conf is
#   127.0.0.1  → AdGuard container
#   1.1.1.1    → public fallback
#   9.9.9.9    → public fallback
# If AdGuard is down (the exact failure mode memory-alert.sh exists to
# warn about — AdGuard can itself be OOM-killed), DNS lookups for
# *.example fall through to public resolvers, which return NXDOMAIN.
# The alert that was supposed to fire never reaches ntfy.
#
# Pinning these hostnames in /etc/hosts removes the AdGuard dependency
# for loopback delivery: nsswitch.conf default order is `files dns`, so
# /etc/hosts wins before any resolver is consulted.
#
# Sprint 016 Story 1 extension: control.example and beszel.example were
# added because they now appear in ntfy action URLs (operator-facing).
# Even though the phone, not the Pi, resolves those at click time, host-
# side scripts (e.g. backup_control_url POSTed by homelab-backup.sh)
# also reference them and benefit from the same safety net.

- name: Pin homelab service hostnames → LAN IP in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\s*\S+\s+{{ item.host | regex_escape }}\b'
    line: "{{ lan_ip }} {{ item.host }}"
    state: present
    owner: root
    group: root
    mode: "0644"
  become: true
  loop:
    - { host: "{{ ntfy_hostname }}" }
    - { host: "{{ control_hostname }}" }
    - { host: "{{ beszel_hostname }}" }
    # 2026-05-21 Sprint 016 Story 1: Mac Tdarr Node + future marker-gen
    # connect to the Pi via these hostnames. AdGuard `*.example` wildcard
    # and Tailscale dnsmasq `address=/homelab/100.64.0.10` already
    # resolve both — /etc/hosts is the safety net for host-side scripts
    # (and for any future container that runs in a network namespace
    # where neither AdGuard nor Tailscale-dns is reachable).
    - { host: "{{ tdarr_hostname }}" }
    - { host: "{{ marker_hostname }}" }
  loop_control:
    label: "{{ item.host }}"
