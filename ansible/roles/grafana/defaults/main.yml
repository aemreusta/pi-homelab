---
# Grafana — dashboards & explore UI for VictoriaMetrics + VictoriaLogs.
# Day-1 deployment so logs↔metrics correlation is queryable from a real UI.
# Auth: admin user + vault password + Traefik basicauth + UFW LAN-only.
# (SSO/OIDC bilinçli olarak ileriye bırakıldı.)

grafana_compose_dir: /home/{{ docker_user }}/docker/observability/grafana
grafana_data_dir: /home/{{ docker_user }}/docker/observability/grafana/data
grafana_provisioning_dir: /home/{{ docker_user }}/docker/observability/grafana/provisioning
grafana_dashboards_dir: /home/{{ docker_user }}/docker/observability/grafana/dashboards
grafana_tz: "{{ timezone }}"

# Grafana internal log level (GF_LOG_LEVEL). `warn` silences the every-30s
# info-level dashboard-service "No last resource version found" polling spam
# (harmless but noisy in VictoriaLogs) while keeping warnings + errors.
grafana_log_level: warn

grafana_image: grafana/grafana-oss:latest
grafana_port: 3003

grafana_admin_user: pi
# Falls back to "admin" so first deploy works without vault edit; Grafana
# forces password change on first login. Add `vault_grafana_admin_password`
# to vault.yml and redeploy to lock in a real password.
grafana_admin_password: "{{ vault_grafana_admin_password | default('admin') }}"

# SSO (Authelia OIDC) client secret — the PLAINTEXT half of the pair; Authelia
# holds the pbkdf2 hash of the same value (authelia_oidc_clients). The local
# admin above stays enabled as break-glass if Authelia is down.
grafana_oidc_client_secret: "{{ vault_authelia_grafana_client_secret | default('') }}"

# Internal CA (generated by the traefik role) mounted read-only so Grafana can
# VERIFY Traefik's self-signed leaf on the OIDC back-channel to auth.<domain>,
# instead of disabling TLS verification.
grafana_internal_ca_src: "/home/{{ docker_user }}/docker/network/traefik/certs/homelab-ca.crt"
grafana_internal_ca_path: /etc/grafana/homelab-ca.crt

# Grafana docs list 750 MiB as the current minimum (Kubernetes install guide,
# v12+). 384 MiB caused silent OOM-style exits mid-startup on 2026-05-20 —
# container looped ~every 60s after Pi reboot, 334 restarts in 100 min.
# 768 MiB clears the floor with a small buffer for plugin loading + bleve
# indexes + sqlite/resource-DB + apiserver init.
grafana_mem_limit: 768M

grafana_network: observability

# Datasource URLs (resolve via observability bridge)
grafana_victoriametrics_url: http://victoriametrics:8428
# VictoriaLogs ships its own Grafana plugin (type victoriametrics-logs-datasource)
# rather than reusing the Loki datasource, because VL only implements Loki's
# *push* API for ingestion — not the query API Grafana's Loki datasource
# expects (/loki/api/v1/labels etc.). The official plugin speaks LogsQL.
grafana_victorialogs_url: http://victorialogs:9428

# Plugins to install at container startup (comma-separated grafana plugin IDs).
grafana_plugins: victoriametrics-logs-datasource

# Dashboards to provision from grafana.com.
# Format: { id: <int>, revision: <int>, slug: <str-for-filename> }
# These are downloaded at deploy time via get_url; if grafana.com is unreachable
# the play continues (failed_when: false) and you can re-run later.
grafana_dashboards:
  - { id: 22084, revision: 11, slug: "victorialogs-single-node" }
  - { id: 10229, revision: 51, slug: "victoriametrics-single-node" }
  - { id: 1860, revision: 45, slug: "node-exporter-full" }
  - { id: 193, revision: 1, slug: "docker-cadvisor" }

# Container runs as this UID (Grafana's official non-root user).
# Override only if switching to a custom image with a different USER directive.
grafana_container_uid: "472"

# --- Container security hardening ---

grafana_pids_limit: 200
grafana_read_only: true
# /tmp is tmpfs (RAM). GF_PLUGINS_PREINSTALL_SYNC downloads plugin archives
# to /tmp before extracting — victoriametrics-logs-datasource exceeds 64 MiB,
# causing "no space left on device" → plugin install fails → backgroundsvcs
# adapter exits with code 0 → container restart loop. Observed 2026-05-21:
# 334+ restarts after Pi reboot. 256 MiB clears the plugin archive with margin
# for future plugins. Comes out of host RAM (no disk impact).
grafana_tmpfs_size: 256m

# Drop all caps. Grafana already runs as user 472 (non-root) so it never had
# CAP_DAC_OVERRIDE in practice — no DAC fixup needed for the data dir.
grafana_cap_drop:
  - ALL
grafana_cap_add: []

grafana_oci_labels:
  org.opencontainers.image.title: grafana
  org.opencontainers.image.description: "Grafana — dashboards & explore UI for VictoriaMetrics + VictoriaLogs"
  org.opencontainers.image.source: "https://github.com/aemreusta/raspi-homelab"
  org.opencontainers.image.documentation: "https://github.com/aemreusta/raspi-homelab/blob/master/ansible/roles/grafana/README.md"
  org.opencontainers.image.vendor: "homelab"
  org.opencontainers.image.url: "https://grafana.com/oss/grafana/"
