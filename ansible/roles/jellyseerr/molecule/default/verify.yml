---
- name: Verify
  hosts: localhost
  gather_facts: false
  vars:
    sandbox: /tmp/molecule-jellyseerr
  tasks:
    - name: Slurp
      ansible.builtin.slurp:
        src: "{{ sandbox }}/docker-compose.yml"
      register: dc
    - name: Decode
      ansible.builtin.set_fact:
        compose_yaml: "{{ (dc.content | b64decode) | from_yaml }}"
    - name: Assert hardening
      ansible.builtin.assert:
        that:
          - "'no-new-privileges:true' in compose_yaml.services.jellyseerr.security_opt"
          - "'ALL' in compose_yaml.services.jellyseerr.cap_drop"
          - compose_yaml.services.jellyseerr.read_only | bool
          - compose_yaml.services.jellyseerr.tmpfs[0] is search('/tmp:.*noexec.*nosuid.*nodev')
          - compose_yaml.services.jellyseerr.pids_limit | int > 0
          - compose_yaml.services.jellyseerr.labels['org.opencontainers.image.title'] is defined
        fail_msg: "jellyseerr hardening incomplete"
