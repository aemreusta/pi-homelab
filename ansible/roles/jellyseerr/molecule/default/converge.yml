---
- name: Converge
  hosts: localhost
  gather_facts: false
  vars:
    docker_user: pi
    timezone: Europe/Istanbul
  pre_tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"
    - name: Override paths
      ansible.builtin.set_fact:
        jellyseerr_compose_dir: /tmp/molecule-jellyseerr
        jellyseerr_config_dir: /tmp/molecule-jellyseerr/config
    - name: Ensure dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ jellyseerr_compose_dir }}"
        - "{{ jellyseerr_config_dir }}"
  tasks:
    - name: Render
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/docker-compose.yml.j2"
        dest: "{{ jellyseerr_compose_dir }}/docker-compose.yml"
        mode: "0644"
