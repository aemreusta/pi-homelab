---
- name: Create Beszel compose directory
  ansible.builtin.file:
    path: "{{ beszel_compose_dir }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create Beszel data directory (root-owned — hub container runs as root)
  ansible.builtin.file:
    path: "{{ beszel_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Create Beszel agent data directory (root-owned — agent container runs as root)
  ansible.builtin.file:
    path: "{{ beszel_agent_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Copy Beszel docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ beszel_compose_dir }}/docker-compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart beszel

- name: Start Beszel containers
  community.docker.docker_compose_v2:
    project_src: "{{ beszel_compose_dir }}"
    state: present
  become: true
  become_user: "{{ docker_user }}"
