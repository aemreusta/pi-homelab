---
- name: Ensure observability docker network
  community.docker.docker_network:
    name: "{{ victoriametrics_network }}"
    driver: bridge

- name: Create VictoriaMetrics compose directory
  ansible.builtin.file:
    path: "{{ victoriametrics_compose_dir }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create VictoriaMetrics data directory (root-owned — container runs as root)
  # With cap_drop: [ALL] the container loses CAP_DAC_OVERRIDE, so directory ownership
  # must match the container's UID (0). Recurse to fix any existing files left from
  # the pre-hardening deploy when these were docker_user-owned.
  ansible.builtin.file:
    path: "{{ victoriametrics_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Copy VictoriaMetrics docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ victoriametrics_compose_dir }}/docker-compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart victoriametrics

- name: Start VictoriaMetrics container
  community.docker.docker_compose_v2:
    project_src: "{{ victoriametrics_compose_dir }}"
    state: present
  become: true
  become_user: "{{ docker_user }}"
