---
- name: Ensure observability docker network
  community.docker.docker_network:
    name: "{{ victorialogs_network }}"
    driver: bridge

- name: Create VictoriaLogs compose directory
  ansible.builtin.file:
    path: "{{ victorialogs_compose_dir }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create VictoriaLogs data directory (root-owned — container runs as root)
  # cap_drop: [ALL] removes CAP_DAC_OVERRIDE; ownership must match container UID (0).
  ansible.builtin.file:
    path: "{{ victorialogs_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Copy VictoriaLogs docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ victorialogs_compose_dir }}/docker-compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart victorialogs

- name: Start VictoriaLogs container
  community.docker.docker_compose_v2:
    project_src: "{{ victorialogs_compose_dir }}"
    state: present
  become: true
  become_user: "{{ docker_user }}"
