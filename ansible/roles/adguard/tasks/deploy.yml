---
- name: Create AdGuard compose directory
  ansible.builtin.file:
    path: "{{ adguard_compose_dir }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Create AdGuard data directories (root-owned — container runs as root)
  # AdGuard runs as root inside the container and writes config + filter cache here.
  # With cap_drop: [ALL] the container loses CAP_DAC_OVERRIDE, so directory ownership
  # must match the container's UID (0). Recurse to fix any existing files left from
  # the pre-hardening deploy when these were docker_user-owned.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true
  loop:
    - "{{ adguard_data_dir }}/work"
    - "{{ adguard_data_dir }}/conf"

- name: Copy AdGuard docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ adguard_compose_dir }}/docker-compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart adguard

- name: Start AdGuard container
  community.docker.docker_compose_v2:
    project_src: "{{ adguard_compose_dir }}"
    state: present
  become: true
  become_user: "{{ docker_user }}"
