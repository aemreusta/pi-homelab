---
- name: Discover Docker root used by containerd task specifications
  ansible.builtin.command:
    argv: [docker, info, --format, "{{ '{{ .DockerRootDir }}' }}"]
  register: cadvisor_docker_info
  changed_when: false
  check_mode: false

- name: Validate the Docker data root before exposing it read-only
  ansible.builtin.assert:
    that:
      - cadvisor_docker_info.stdout.startswith('/')
      - cadvisor_docker_info.stdout | trim != '/'

- name: Set cAdvisor Docker root
  ansible.builtin.set_fact:
    cadvisor_docker_data_root: "{{ cadvisor_docker_info.stdout | trim }}"

- name: Create cAdvisor compose directory
  ansible.builtin.file:
    path: "{{ cadvisor_compose_dir }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"

- name: Copy cAdvisor docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ cadvisor_compose_dir }}/docker-compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0644"
  notify: Restart cadvisor

- name: Start cAdvisor container
  community.docker.docker_compose_v2:
    project_src: "{{ cadvisor_compose_dir }}"
    state: present
  become: true
  become_user: "{{ docker_user }}"
