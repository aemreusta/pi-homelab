---
- name: Verify — assert hardening directives are present in rendered files
  hosts: localhost
  gather_facts: false
  vars:
    sandbox: /tmp/molecule-traefik
  tasks:

    - name: Slurp docker-compose.yml
      ansible.builtin.slurp:
        src: "{{ sandbox }}/docker-compose.yml"
      register: dc

    - name: Decode docker-compose
      ansible.builtin.set_fact:
        compose_yaml: "{{ (dc.content | b64decode) | from_yaml }}"

    - name: Assert security_opt no-new-privileges
      ansible.builtin.assert:
        that:
          - "'no-new-privileges:true' in compose_yaml.services.traefik.security_opt"
        fail_msg: "no-new-privileges:true missing from security_opt"

    - name: Assert cap_drop ALL
      ansible.builtin.assert:
        that:
          - "'ALL' in compose_yaml.services.traefik.cap_drop"
        fail_msg: "cap_drop must include ALL"

    - name: Assert cap_add NET_BIND_SERVICE
      ansible.builtin.assert:
        that:
          - "'NET_BIND_SERVICE' in compose_yaml.services.traefik.cap_add"
        fail_msg: "cap_add must include NET_BIND_SERVICE"

    - name: Assert read_only true
      ansible.builtin.assert:
        that:
          - compose_yaml.services.traefik.read_only | bool
        fail_msg: "read_only must be true"

    - name: Assert tmpfs has /tmp with size + hardening flags
      ansible.builtin.assert:
        that:
          - compose_yaml.services.traefik.tmpfs | length > 0
          - compose_yaml.services.traefik.tmpfs[0] is search('^/tmp:')
          - compose_yaml.services.traefik.tmpfs[0] is search('size=')
          - compose_yaml.services.traefik.tmpfs[0] is search('noexec')
          - compose_yaml.services.traefik.tmpfs[0] is search('nosuid')
          - compose_yaml.services.traefik.tmpfs[0] is search('nodev')
        fail_msg: "tmpfs /tmp missing or missing hardening flags (noexec,nosuid,nodev,size)"

    - name: Assert pids_limit set and reasonable
      ansible.builtin.assert:
        that:
          - compose_yaml.services.traefik.pids_limit is defined
          - compose_yaml.services.traefik.pids_limit | int > 0
          - compose_yaml.services.traefik.pids_limit | int <= 500
        fail_msg: "pids_limit missing or out of range"

    - name: Assert mem_limit set
      ansible.builtin.assert:
        that:
          - compose_yaml.services.traefik.mem_limit is defined
        fail_msg: "mem_limit must be set"

    - name: Assert healthcheck uses traefik built-in CLI
      ansible.builtin.assert:
        that:
          - "'traefik' in compose_yaml.services.traefik.healthcheck.test"
          - "'healthcheck' in compose_yaml.services.traefik.healthcheck.test"
        fail_msg: "healthcheck must use traefik healthcheck CLI"

    - name: Assert OCI labels present
      ansible.builtin.assert:
        that:
          - compose_yaml.services.traefik.labels['org.opencontainers.image.title'] is defined
          - compose_yaml.services.traefik.labels['org.opencontainers.image.source'] is defined
          - compose_yaml.services.traefik.labels['org.opencontainers.image.version'] is defined
          - compose_yaml.services.traefik.labels['org.opencontainers.image.vendor'] is defined
          - compose_yaml.services.traefik.labels['org.opencontainers.image.documentation'] is defined
          - compose_yaml.services.traefik.labels['org.opencontainers.image.description'] is defined
        fail_msg: "OCI image labels incomplete"

    - name: Assert network_mode host preserved
      ansible.builtin.assert:
        that:
          - compose_yaml.services.traefik.network_mode == 'host'
        fail_msg: "network_mode: host is mandatory for backend localhost routing"

    - name: Slurp dynamic.yml
      ansible.builtin.slurp:
        src: "{{ sandbox }}/config/dynamic.yml"
      register: dyn

    - name: Decode dynamic.yml
      ansible.builtin.set_fact:
        dyn_yaml: "{{ (dyn.content | b64decode) | from_yaml }}"

    - name: Assert tls.options.default set
      ansible.builtin.assert:
        that:
          - dyn_yaml.tls.options.default.minVersion == 'VersionTLS12'
          - dyn_yaml.tls.options.default.cipherSuites | length >= 4
          - "'TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256' in dyn_yaml.tls.options.default.cipherSuites"
          - dyn_yaml.tls.options.default.curvePreferences | length > 0
        fail_msg: "tls.options.default missing or weak"

    - name: Slurp traefik.yml
      ansible.builtin.slurp:
        src: "{{ sandbox }}/config/traefik.yml"
      register: stat

    - name: Decode traefik.yml
      ansible.builtin.set_fact:
        stat_yaml: "{{ (stat.content | b64decode) | from_yaml }}"

    - name: Assert ping endpoint enabled
      ansible.builtin.assert:
        that:
          - stat_yaml.ping is defined
        fail_msg: "ping must be enabled in static config (required by healthcheck)"
