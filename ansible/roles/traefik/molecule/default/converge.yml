---
- name: Converge — render Traefik templates to tmp dir for assertion
  hosts: localhost
  gather_facts: false
  vars:
    docker_user: pi
    timezone: Europe/Istanbul
    vault_tailscale_fqdn: homelab.tail-test.ts.net
    vault_traefik_dashboard_htpasswd: "admin:$2y$05$abcdefghijklmnopqrstuv"
  pre_tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"

    - name: Override compose/config/certs dirs to a tmp sandbox
      ansible.builtin.set_fact:
        traefik_compose_dir: /tmp/molecule-traefik
        traefik_config_dir: /tmp/molecule-traefik/config
        traefik_certs_dir: /tmp/molecule-traefik/certs

    - name: Ensure sandbox dirs exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ traefik_compose_dir }}"
        - "{{ traefik_config_dir }}"
        - "{{ traefik_certs_dir }}"
  tasks:
    - name: Render docker-compose.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/docker-compose.yml.j2"
        dest: "{{ traefik_compose_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Render traefik.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/traefik.yml.j2"
        dest: "{{ traefik_config_dir }}/traefik.yml"
        mode: "0644"

    - name: Render dynamic.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/dynamic.yml.j2"
        dest: "{{ traefik_config_dir }}/dynamic.yml"
        mode: "0644"
