---
- name: Allow Portainer HTTP through UFW
  community.general.ufw:
    rule: allow
    port: "9000"
    proto: tcp
    from_ip: "{{ lan_subnet }}"
    comment: Portainer HTTP UI

- name: Allow Portainer HTTPS through UFW
  community.general.ufw:
    rule: allow
    port: "9443"
    proto: tcp
    from_ip: "{{ lan_subnet }}"
    comment: Portainer HTTPS UI

# One-time reconciliation of the pre-2026-07-14 Anywhere rules (see media role
# ufw.yml for the rationale). Idempotent no-op once removed.
- name: Remove superseded Anywhere rules (migrated to LAN scope, Phase 0)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    delete: true
  loop:
    - "9000"
    - "9443"
