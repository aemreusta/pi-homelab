---
- name: Converge — render media templates to tmp dir for assertion
  hosts: localhost
  gather_facts: false
  vars:
    docker_user: pi
    timezone: Europe/Istanbul
  pre_tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"

    - name: Override paths to tmp sandbox
      ansible.builtin.set_fact:
        media_compose_dir: /tmp/molecule-media
        media_config_dir: /tmp/molecule-media/config

    - name: Ensure sandbox dirs exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ media_compose_dir }}"
        - "{{ media_config_dir }}"
  tasks:
    - name: Render docker-compose.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/docker-compose.yml.j2"
        dest: "{{ media_compose_dir }}/docker-compose.yml"
        mode: "0644"
