[defaults]

inventory = inventory/hosts.ini
vault_password_file = .vault-password
host_key_checking = False
retry_files_enabled = False
timeout = 30

interpreter_python = auto_silent
roles_path = ./roles:ansible/roles

# Gathered facts are accessed ONLY via ansible_facts['<key>'] (never the
# deprecated top-level ansible_<key> injection). Disabling injection here both
# silences the INJECT_FACTS_AS_VARS deprecation and turns any future regression
# into a hard undefined-var failure instead of a silent warning. All in-repo
# usages were migrated 2026-07-03; connection/magic vars (ansible_host,
# ansible_user, ansible_check_mode, ansible_version…) are unaffected by this.
inject_facts_as_vars = false
